[package]
name = "app"
version = "0.5.1"
description = "A Tauri App"
authors = ["Yumeo"]
license = "GPL-3.0-only"
repository = ""
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
base64 = "0.23"
bytes = "1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=3.0.0-alpha.5", features = ["protocol-asset"] }
tauri-runtime-wry = "=3.0.0-alpha.5"
tauri-plugin-log = "=3.0.0-alpha.3"
tauri-plugin-opener = "=3.0.0-alpha.3"
tauri-plugin-os = "=3.0.0-alpha.3"
tauri-plugin-mcp-bridge = { path = ".cache/tauri-plugin-mcp-bridge", optional = true }
playwire = "2"
reqwest = { version = "0.13", default-features = false, features = [
  "http2",
  "rustls",
] }
tokio = { version = "1", features = ["sync", "time"] }
discord-rich-presence = "1.1.0"

# Self-updating is desktop-only; mobile builds must not pull the plugins in.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=3.0.0-alpha.3"
tauri-plugin-process = "=3.0.0-alpha.3"

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"

# The native media session identifies the app by AUMID; setting it on the
# process lets Windows resolve the name and icon from the installed shortcut.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell"] }
windows-core = "0.62"
webview2-com = "0.39"
